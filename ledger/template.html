<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovelAI Session Ledger</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1d29;--mut:#777;--line:#ccd;--card:#f3f3f8;--acc:#3b5bdb}
@media (prefers-color-scheme:dark){:root{--bg:#14151f;--fg:#e8e8f0;--mut:#99a;--line:#3a3d5c;--card:#1d1f2e;--acc:#8fa5ff}}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,sans-serif;max-width:1200px;margin-inline:auto}
h1{font-size:20px} #drop{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;background:var(--card)} #drop.on{border-color:var(--acc)}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:6px 12px} button:hover{border-color:var(--acc)}
#status{margin:10px 0;color:var(--acc)} #status.err{color:#e03131} ul{padding-left:20px} #save{margin:10px 0;display:flex;gap:8px}
iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff} small{color:var(--mut)}
</style></head><body>
<h1>NovelAI Session Ledger（生成台帳）</h1>
<p><small>拡張機能の「ZIP保存」で書き出したセッションZIPから、サムネイル付きHTMLとCSVの生成台帳を作ります。ファイルはこのPCの外に送られません（通信なし）。</small></p>
<div id="drop">ZIPをここにドラッグ＆ドロップ（複数可）<br><button id="pick">ファイルを選ぶ</button><input id="file" type="file" accept=".zip" multiple hidden></div>
<div id="status"></div>
<ul id="list"></ul>
<div id="save" hidden><button id="html">HTML台帳を保存</button><button id="csv">CSVを保存</button></div>
<iframe id="preview" hidden></iframe>
<script>
/*CORE*/
</script>
<script>
/*APP*/
</script>
</body></html>
